name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verifier-tag:
    name: Vérifier le tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./scripts/ci/verifier-version-tag.sh "$GITHUB_REF_NAME"

  linux:
    name: Linux ${{ matrix.arch }}
    needs: verifier-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, armv7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: "**/go.sum"
      - run: ./scripts/ci/client-linux.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/client-linux/
          retention-days: 3
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    needs: verifier-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: windows-latest
          - arch: aarch64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: "1.96.1"
          components: rustfmt
      - name: Installer NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: bash scripts/ci/client-windows.sh ${{ matrix.arch }}
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/client-windows/
          retention-days: 3
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: verifier-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-latest
          - arch: amd64
            os: macos-15-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: "**/go.sum"
      - run: ./scripts/ci/client-macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/client-macos/
          retention-days: 3
          if-no-files-found: error

  android:
    name: Android
    needs: verifier-tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      # L'action setup-android n'arrive plus à accepter les licences du SDK
      # préinstallé (sdkmanager 16.0 rend la main sur « Review licenses ») :
      # les paquets sont installés ici, licences acceptées par `yes`.
      - name: SDK et NDK épinglés
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMGR=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | tail -1)
          echo "ANDROID_HOME=$SDK" >>"$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >>"$GITHUB_ENV"
          yes | "$SDKMGR" --licenses >/dev/null
          "$SDKMGR" --install "platforms;android-34" "build-tools;36.1.0" "ndk;26.3.11579264"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client-android/rust/target
          key: android-cargo-${{ hashFiles('client-android/rust/Cargo.lock') }}
          restore-keys: android-cargo-
      - run: ./scripts/ci/client-android.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-android
          path: dist/client-android/
          retention-days: 3
          if-no-files-found: error

  openwrt:
    name: OpenWrt ${{ matrix.cible }}
    needs: verifier-tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - cible: ramips/mt7621
            arch: mipsel_24kc
          - cible: mediatek/filogic
            arch: aarch64_cortex-a53
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: "**/go.sum"
      - run: ./scripts/ci/client-openwrt.sh
        env:
          OPENWRT_TARGETS: ${{ matrix.cible }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-openwrt-${{ matrix.arch }}
          path: dist/client-openwrt/
          retention-days: 3
          if-no-files-found: error

  noeud-rpi:
    name: Nœud Raspberry Pi
    needs: verifier-tag
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: "**/go.sum"
      - run: ./scripts/ci/image-rpi.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-noeud-rpi
          path: |
            dist/rpi/*.img.xz
            dist/rpi/*.img.xz.sha256
          retention-days: 3
          if-no-files-found: error

  images:
    name: Images GHCR
    needs: verifier-tag
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Connexion GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: ./scripts/ci/images-release.sh "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-images
          path: dist/images.txt
          retention-days: 3
          if-no-files-found: error

  publier:
    name: Release brouillon
    needs: [linux, windows, macos, android, openwrt, noeud-rpi, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - run: ./scripts/ci/release-assembler.sh "$GITHUB_REF_NAME"
      - name: Notes de version
        run: ./scripts/ci/notes-release.sh "$GITHUB_REF_NAME" >"$RUNNER_TEMP/notes.md"
      - name: Attestations de provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "dist/release/*"
      - name: Créer la release brouillon
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "TorDNS $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
