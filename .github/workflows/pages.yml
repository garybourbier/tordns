name: Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "scripts/ci/site-genere.sh"
      - "scripts/ci/copier-etat-reseau.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  construire:
    name: Construire le site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Installer Tor pour la copie optionnelle
        if: vars.TORDNS_PUBLIER_ETAT_RESEAU == 'oui'
        run: sudo apt-get update && sudo apt-get install -y tor
      - name: Copier l'état du réseau (optionnel)
        if: vars.TORDNS_PUBLIER_ETAT_RESEAU == 'oui'
        env:
          TORDNS_REGISTRE_ONION: ${{ vars.TORDNS_REGISTRE_ONION }}
        run: ./scripts/ci/copier-etat-reseau.sh
      - run: ./scripts/ci/site-genere.sh
        env:
          TORDNS_REGISTRE_ONION: ${{ vars.TORDNS_REGISTRE_ONION }}
          TORDNS_COPIE_ETAT_RESEAU: ${{ vars.TORDNS_PUBLIER_ETAT_RESEAU }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deployer:
    name: Déployer
    needs: construire
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
