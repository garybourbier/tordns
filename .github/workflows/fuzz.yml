name: Fuzz

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go ${{ matrix.cible }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        cible:
          - FuzzPasserelleDoH
          - FuzzRelaisClient
          - FuzzValiderDNSSEC
          - FuzzEnTeteProxy
          - FuzzManifeste
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: "**/go.sum"
      - run: ./scripts/ci/fuzz.sh 10m ${{ matrix.cible }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: corpus-go-${{ matrix.cible }}
          path: dist/fuzz-corpus/
          retention-days: 30
          if-no-files-found: ignore

  rust:
    name: Rust ${{ matrix.cible }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        cible: [rust-dns, rust-manifeste]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: nightly
      - name: cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - run: ./scripts/ci/fuzz.sh 10m ${{ matrix.cible }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: corpus-${{ matrix.cible }}
          path: |
            client-windows/fuzz/corpus/
            outils/manifeste-rust/fuzz/corpus/
          retention-days: 30
          if-no-files-found: ignore
