name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.23.x"
          cache-dependency-path: "**/go.sum"
      - run: ./scripts/ci/lint.sh

  linux:
    name: Linux ${{ matrix.arch }} (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
            suffix: croise
          - arch: arm64
            os: ubuntu-latest
            suffix: croise
          - arch: armv7
            os: ubuntu-latest
            suffix: croise
          - arch: arm64
            os: ubuntu-24.04-arm
            suffix: natif
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.23.x"
          cache-dependency-path: "**/go.sum"
      - run: ./scripts/ci/client-linux.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.arch }}-${{ matrix.suffix }}
          path: dist/client-linux/
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: windows-latest
          - arch: aarch64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: "1.96.1"
          components: rustfmt
      - name: Installer NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: bash scripts/ci/client-windows.sh ${{ matrix.arch }}
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/client-windows/
          retention-days: 7
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-latest
          - arch: amd64
            os: macos-15-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.23.x"
          cache-dependency-path: "**/go.sum"
      - run: ./scripts/ci/client-macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/client-macos/
          retention-days: 7
          if-no-files-found: error

  ios:
    name: iOS (simulateur)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # Secrets facultatifs : absents, l'archive signée et TestFlight sont
      # sautés (voir scripts/ci/client-ios.sh).
      TORDNS_TEAM_ID: ${{ secrets.TORDNS_TEAM_ID }}
      TORDNS_APPLE_ID: ${{ secrets.TORDNS_APPLE_ID }}
      TORDNS_APPLE_MOT_DE_PASSE: ${{ secrets.TORDNS_APPLE_MOT_DE_PASSE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # xcodegen n'a pas d'empreinte de commit publiable : il est installé par
      # Homebrew, version imprimée dans le journal du job.
      - run: brew install xcodegen && xcodegen --version
      - run: ./scripts/ci/client-ios.sh

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: SDK et NDK épinglés
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-34" "build-tools;36.1.0" "ndk;26.3.11579264" >/dev/null
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client-android/rust/target
          key: android-cargo-${{ hashFiles('client-android/rust/Cargo.lock') }}
          restore-keys: android-cargo-
      - run: ./scripts/ci/client-android.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          path: dist/client-android/
          retention-days: 7
          if-no-files-found: error

  openwrt:
    name: OpenWrt ${{ matrix.cible }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - cible: ramips/mt7621
            arch: mipsel_24kc
          - cible: mediatek/filogic
            arch: aarch64_cortex-a53
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.23.x"
          cache-dependency-path: "**/go.sum"
      - run: ./scripts/ci/client-openwrt.sh
        env:
          OPENWRT_TARGETS: ${{ matrix.cible }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openwrt-${{ matrix.arch }}
          path: dist/client-openwrt/
          retention-days: 7
          if-no-files-found: error

  images:
    name: Images ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: ./scripts/ci/noeud-images.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: images-${{ matrix.arch }}
          path: dist/noeud-images/
          retention-days: 7
          if-no-files-found: error
