# TorDNS — contrôleur Onionbalance (Mission 9).
#
# À faire tourner sur un hôte qui n'est PAS un nœud : il détient la clé
# maîtresse et publie le descripteur qui agrège les points d'introduction des
# instances listées dans le pool. Aucun port publié : le seul accès est le
# service caché maître lui-même.
#
# Lancé par controleur/scripts/demarrer.sh, qui écrit le pool et le
# `config.yaml` à partir de `pools/coeur.txt`, puis passe son `.env`.
name: tordns-controleur

x-durcissement: &durcissement
  restart: unless-stopped
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  pids_limit: 128
  ulimits:
    nofile:
      soft: 512
      hard: 1024
  logging:
    driver: "none"

services:
  # Tor de publication : son port de contrôle sert à onionbalance pour lire
  # les descripteurs d'instances et téléverser le descripteur maître.
  tor:
    build:
      context: ./tor
    image: tordns/controleur-tor:local
    container_name: tordns-controleur-tor
    <<: *durcissement
    mem_limit: 192m
    cpus: 0.50
    user: "${TORDNS_CONTROLEUR_UID:-100}:${TORDNS_CONTROLEUR_GID:-101}"
    volumes:
      # Le dossier Tor est un sous-dossier : la clé maîtresse reste à côté,
      # hors du répertoire de travail de Tor.
      - ${TORDNS_CONTROLEUR_DONNEES:?chemin des données du contrôleur manquant}/tor:/var/lib/tor
      - ./tor/torrc:/etc/tor/torrc:ro
    networks:
      - controleur
    healthcheck:
      # Le socket de contrôle n'existe qu'une fois Tor démarré.
      test: ["CMD", "test", "-S", "/var/lib/tor/control_socket"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Onionbalance v3 : lit la clé maîtresse et le config.yaml générés dans le
  # dossier de données, jamais versionnés.
  onionbalance:
    build:
      context: ./onionbalance
    image: tordns/onionbalance:local
    container_name: tordns-controleur-onionbalance
    <<: *durcissement
    mem_limit: 160m
    cpus: 0.30
    user: "${TORDNS_CONTROLEUR_UID:-100}:${TORDNS_CONTROLEUR_GID:-101}"
    command:
      - -v
      - info
      - -c
      - /donnees/config.yaml
      - -s
      - /var/lib/tor/control_socket
    environment:
      HOME: /tmp
      ONIONBALANCE_LOG_LEVEL: info
    volumes:
      - ${TORDNS_CONTROLEUR_DONNEES:?chemin des données du contrôleur manquant}:/donnees:ro
      # Le cookie de contrôle est annoncé par Tor avec son chemin absolu : il
      # doit exister au même endroit ici pour que stem l'authentifie.
      - ${TORDNS_CONTROLEUR_DONNEES:?chemin des données du contrôleur manquant}/tor:/var/lib/tor:ro
    depends_on:
      tor:
        condition: service_healthy
    networks:
      - controleur

  # Second Onionbalance : adresse communauté, alimentée uniquement par le
  # pool écrit par le registre. Clé et configuration distinctes de celles du
  # pool cœur ; un bénévole n'entre jamais dans le pool cœur.
  onionbalance-communaute:
    build:
      context: ./onionbalance
    image: tordns/onionbalance:local
    container_name: tordns-controleur-onionbalance-communaute
    <<: *durcissement
    mem_limit: 160m
    cpus: 0.30
    profiles: ["communaute"]
    user: "${TORDNS_CONTROLEUR_UID:-100}:${TORDNS_CONTROLEUR_GID:-101}"
    command:
      - -v
      - info
      - -c
      - /donnees/config-communaute.yaml
      - -s
      - /var/lib/tor/control_socket
    environment:
      HOME: /tmp
      ONIONBALANCE_LOG_LEVEL: info
    volumes:
      - ${TORDNS_CONTROLEUR_DONNEES:?chemin des données du contrôleur manquant}:/donnees:ro
      - ${TORDNS_CONTROLEUR_DONNEES:?chemin des données du contrôleur manquant}/tor:/var/lib/tor:ro
    depends_on:
      tor:
        condition: service_healthy
    networks:
      - controleur

  # Résolveur de référence du registre : même configuration DNSSEC que les
  # nœuds, aucun port publié. Le registre compare le bit AD et le RCODE des
  # nœuds à cette résolution.
  unbound:
    build:
      context: ../serveur/unbound
    image: tordns/unbound:local
    container_name: tordns-controleur-unbound
    <<: *durcissement
    # Comme le nœud : l'entrypoint prépare l'ancre (chown puis passage à
    # l'utilisateur unbound), puis Unbound abandonne ces privilèges.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    # Le point de montage de l'ancre racine doit rester inscriptible malgré
    # le rootfs en lecture seule ; l'entrypoint y régénère root.key.
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/lib/unbound:size=16m,mode=0755
    mem_limit: 192m
    cpus: 0.50
    networks:
      - controleur
    healthcheck:
      test: ["CMD", "dig", "+short", "+tcp", "@127.0.0.1", "-p", "5335", ".", "NS"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # API du registre communautaire : inscription, confirmation du défi, page
  # publique. Exposée seulement par le service caché Tor `registre`.
  registre:
    build:
      context: ./registre
    image: tordns/registre:local
    container_name: tordns-controleur-registre
    <<: *durcissement
    mem_limit: 128m
    cpus: 0.30
    user: "${TORDNS_CONTROLEUR_UID:-100}:${TORDNS_CONTROLEUR_GID:-101}"
    command:
      - -etat
      - /donnees/registre.json
      - -pool
      - /pools/communaute.txt
      - -domaines
      - /domaines.txt
      - -reference
      - unbound:5335
      - -socks
      - tor:9050
      - -ecoute
      - :8080
    volumes:
      - ${TORDNS_CONTROLEUR_DONNEES:?chemin des données du contrôleur manquant}/registre:/donnees
      - ${TORDNS_CONTROLEUR_DONNEES:?chemin des données du contrôleur manquant}/pools:/pools
      - ./domaines.txt:/domaines.txt:ro
    depends_on:
      tor:
        condition: service_healthy
      unbound:
        condition: service_healthy
    networks:
      controleur:
        # IP fixe ciblée par le service caché Tor (torrc). Évite un cycle :
        # Tor ne peut pas résoudre « registre » avant que ce conteneur tourne,
        # et le registre attend que Tor soit sain.
        ipv4_address: 172.28.58.10
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/etat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # Réseau privé : Tor, onionbalance, registre et Unbound ; aucun port publié.
  # Le sous-réseau fixe est autorisé par serveur/unbound/unbound.conf.
  controleur:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.58.0/24
