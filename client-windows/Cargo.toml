[package]
name = "tordns-windows"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
publish = false
description = "Client Windows TorDNS : relais DNS local vers le service caché Tor"

[lib]
name = "tordns_win"
path = "src/lib.rs"

[[bin]]
name = "tordns-client"
path = "src/main.rs"

[dependencies]
futures = "0.3"
hex = "0.4"
hickory-proto = { version = "0.24", default-features = false, features = ["dnssec-ring"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tordns-manifeste = { path = "../outils/manifeste-rust" }

[dev-dependencies]
ed25519-dalek = { version = "2.2", features = ["rand_core"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
