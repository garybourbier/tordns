# TorDNS — stack serveur locale (Missions 1 à 3)
# Aucune de ces images ne publie autre chose que 127.0.0.1 sur l'hôte.
# Aucun journal de requêtes : ni Unbound, ni la passerelle, ni Caddy n'écrivent
# le détail des questions DNS (voir serveur/README.md).
name: tordns

# Durcissement commun (Mission 3) : pas de privilèges supplémentaires, toutes
# les capacités retirées, système de fichiers racine en lecture seule, limites
# de mémoire / processus / descripteurs. Docker applique en plus par défaut son
# profil seccomp et le profil AppArmor « docker-default ».
x-durcissement: &durcissement
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  pids_limit: 256
  ulimits:
    nofile:
      soft: 1024
      hard: 2048

services:
  # Résolveur récursif depuis les racines, validation DNSSEC obligatoire,
  # aucun forward, aucune journalisation des requêtes.
  unbound:
    build:
      context: ./unbound
    image: tordns/unbound:local
    container_name: tordns-unbound
    restart: unless-stopped
    <<: *durcissement
    # Unbound démarre en root uniquement pour préparer l'ancre DNSSEC puis
    # passer à l'utilisateur `unbound` : ces quatre capacités sont le strict
    # minimum, tout le reste est retiré.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    mem_limit: 256m
    # Aucun port publié : depuis la Mission 2, Unbound n'est joignable que sur
    # le réseau docker interne `dns` (passerelle incluse), jamais depuis l'hôte.
    volumes:
      - unbound-lib:/var/lib/unbound
    networks:
      dns:
        ipv4_address: 172.28.53.10
      sortie: {}
    logging:
      driver: "none"
    healthcheck:
      test: ["CMD", "dig", "@127.0.0.1", "-p", "5335", "cloudflare.com", "A", "+short", "+time=2", "+tries=1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Passerelle DoH (RFC 8484) : HTTP -> DNS filaire -> Unbound.
  # Non publiée sur l'hôte : seul Caddy (et, en Mission 2, Tor) peut l'atteindre.
  passerelle:
    build:
      context: ./passerelle
    image: tordns/passerelle:local
    container_name: tordns-passerelle
    restart: unless-stopped
    <<: *durcissement
    mem_limit: 128m
    environment:
      UNBOUND_ADDR: "unbound:5335"
      LISTEN_ADDR: ":8053"
      # Limite globale (pas par IP : derrière Tor, tous les clients partagent
      # l'adresse de sortie du démon Tor) et parallélisme borné.
      LIMITE_REQ_S: "200"
      LIMITE_RAFALE: "400"
      MAX_CONCURRENTS: "64"
    networks:
      - dns
    depends_on:
      unbound:
        condition: service_healthy
    logging:
      driver: "none"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8053/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Front HTTP local. En Mission 2, Tor exposera ce service en .onion (HTTP en
  # clair à l'intérieur du circuit Tor, jamais sur l'hôte).
  caddy:
    image: caddy:2-alpine
    container_name: tordns-caddy
    restart: unless-stopped
    <<: *durcissement
    # Le binaire Caddy de l'image porte la capacité de fichier
    # CAP_NET_BIND_SERVICE ; sans elle dans l'ensemble de capacités, execve
    # échoue dès que toutes les autres sont retirées.
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 128m
    # Aucun port publié : seul Tor (réseau `dns`) atteint Caddy. L'unique
    # point d'entrée distant est l'adresse .onion.
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks:
      dns:
        # IP fixe : Tor exige une cible IP:port pour le service caché.
        ipv4_address: 172.28.53.20
    tmpfs:
      - /tmp:size=16m,mode=1777
      # Caddy écrit sa configuration autosauvegardée dans /config.
      - /config:size=8m,mode=0700
    depends_on:
      passerelle:
        condition: service_healthy
    logging:
      driver: "none"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Service caché Tor v3 : publie Caddy sur une adresse .onion et fournit le
  # SOCKS local utilisé pour la preuve. Les clés v3 vivent dans le volume
  # `tor-data`, hors dépôt ; `scripts/gestion-cles.sh` en fait une copie de
  # sauvegarde dans serveur/tor/keys/ (ignoré par git).
  tor:
    build:
      context: ./tor
    image: tordns/tor:local
    container_name: tordns-tor
    restart: unless-stopped
    <<: *durcissement
    mem_limit: 256m
    environment:
      TOR_SOCKS_PORT: "${TOR_SOCKS_PORT:-9050}"
    ports:
      # SOCKS uniquement sur loopback : c'est le point d'entrée des tests
      # locaux. Le port 9050 est configurable car il peut être déjà pris par
      # le Tor du système (voir serveur/.env.example).
      - "127.0.0.1:${TOR_SOCKS_PORT:-9050}:9050"
    volumes:
      - tor-data:/var/lib/tor
    networks:
      - dns
      - sortie
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9050"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  # Réseau privé : Unbound, passerelle, Caddy et Tor. `internal: true`
  # interdit toute sortie vers Internet depuis ce réseau.
  dns:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.53.0/24
  # Réseau de sortie : uniquement Unbound (récursion) et Tor (circuits).
  sortie:
    driver: bridge

volumes:
  unbound-lib:
  caddy-data:
  # Contient DataDirectory + clés du service caché v3. Jamais monté dans le
  # dépôt ; sauvegarde explicite via scripts/gestion-cles.sh.
  tor-data:
