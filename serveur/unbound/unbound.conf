# TorDNS — Unbound : récursif depuis les racines, DNSSEC obligatoire,
# aucune journalisation des requêtes, aucune confiance à un forwarder.
server:
    # Écoute uniquement sur le réseau docker privé (le port 5335 n'est publié
    # que sur 127.0.0.1 par docker-compose).
    interface: 0.0.0.0
    port: 5335

    # Pas de récursion ouverte : seuls le réseau docker dédié et la boucle
    # locale sont autorisés ; tout le reste est refusé.
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 172.28.53.0/24 allow

    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    do-daemonize: no

    username: "unbound"
    directory: "/etc/unbound"
    chroot: ""
    pidfile: ""

    # --- Zéro journalisation des requêtes ---
    verbosity: 0
    use-syslog: no
    logfile: ""
    log-queries: no
    log-replies: no
    log-local-actions: no
    log-servfail: no
    val-log-level: 0

    # --- Récursion depuis les racines, sans forward ---
    root-hints: "/etc/unbound/root.hints"
    qname-minimisation: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: yes
    aggressive-nsec: yes
    prefetch: no
    rrset-roundrobin: yes
    minimal-responses: yes

    # --- DNSSEC : validation obligatoire ---
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    trust-anchor-signaling: yes

    # Taille réseau raisonnable, pas de fragmentation.
    edns-buffer-size: 1232
    max-udp-size: 1232
    msg-buffer-size: 65552

    # Ne pas divulguer la version du résolveur.
    hide-identity: yes
    hide-version: yes

remote-control:
    control-enable: no
