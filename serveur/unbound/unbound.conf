# TorDNS — Unbound : récursif depuis les racines, DNSSEC obligatoire,
# aucune journalisation des requêtes, aucune confiance à un forwarder.
server:
    # Écoute sur les réseaux docker (privé `dns` + `sortie`). Aucun port n'est
    # publié sur l'hôte : seuls la passerelle et le réseau docker s'y connectent.
    interface: 0.0.0.0
    port: 5335

    # Pas de récursion ouverte : seul le réseau docker privé est autorisé ;
    # tout le reste (dont le réseau `sortie` et l'hôte) est refusé.
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 172.28.53.0/24 allow
    # Nœud installable (mission 8) : réseau privé distinct sur le même hôte
    # de test. Un VPS réel n'a que l'un des deux.
    access-control: 172.28.54.0/24 allow

    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    do-daemonize: no

    username: "unbound"
    directory: "/etc/unbound"
    chroot: ""
    pidfile: ""

    # --- Zéro journalisation des requêtes ---
    verbosity: 0
    use-syslog: no
    logfile: ""
    log-queries: no
    log-replies: no
    log-local-actions: no
    log-servfail: no
    val-log-level: 0

    # --- Récursion depuis les racines, sans forward ---
    root-hints: "/etc/unbound/root.hints"
    qname-minimisation: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: yes
    aggressive-nsec: yes
    prefetch: no
    rrset-roundrobin: yes
    minimal-responses: yes

    # --- Durcissement (Mission 3) ---
    # Refus des requêtes ANY : elles sont inutiles pour un résolveur et
    # constituent le vecteur d'amplification DNS classique.
    deny-any: yes
    # Vérification de casse aléatoire (0x20) des noms : complique
    # l'empoisonnement de cache par un attaquant hors chemin.
    use-caps-for-id: yes
    harden-algo-downgrade: yes
    harden-unknown-additional: yes

    # --- DNSSEC : validation obligatoire ---
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    trust-anchor-signaling: yes

    # Taille réseau raisonnable, pas de fragmentation.
    edns-buffer-size: 1232
    max-udp-size: 1232
    msg-buffer-size: 65552

    # Ne pas divulguer la version du résolveur.
    hide-identity: yes
    hide-version: yes

remote-control:
    control-enable: no
