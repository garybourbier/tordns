[package]
name = "tordns-arti"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false

[lib]
name = "tordns_arti"
crate-type = ["cdylib", "rlib"]

[dependencies]
arti-client = { version = "0.48", default-features = false, features = [
  "tokio",
  "rustls",
  "onion-service-client",
  "static-sqlite",
  "compression",
] }
futures = "0.3"
jni = "0.21"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tor-rtcompat = "0.48.0"
tordns-manifeste = { path = "../../outils/manifeste-rust" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
