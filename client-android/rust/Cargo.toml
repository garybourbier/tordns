[package]
name = "tordns-arti"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false

[lib]
name = "tordns_arti"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.22"
tordns-manifeste = { path = "../../outils/manifeste-rust" }
tordns-tor = { path = "../../outils/arti-rust" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
