[package]
name = "tordns-tor"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false
description = "Client Tor (Arti) et DoH vers le service caché TorDNS, partagé par les clients Android et iOS"

[lib]
name = "tordns_tor"
path = "src/lib.rs"

[dependencies]
arti-client = { version = "0.48", default-features = false, features = [
  "tokio",
  "rustls",
  "onion-service-client",
  "static-sqlite",
  "compression",
] }
futures = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tor-rtcompat = "0.48.0"
